services:
  db:
    image: postgres:15
    container_name: main_db
    restart: always
    env_file:
      - ./Backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      - TZ=Europe/Moscow
    container_name: main_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    depends_on:
      - db

volumes:
  postgres_data: